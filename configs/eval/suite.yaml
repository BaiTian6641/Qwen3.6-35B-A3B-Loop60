# Held-out evaluation with the loop-depth sweep (depth 1 = stock graph, 2 = trained, 3 = extrapolation
# only if num_passes was raised). NEVER train on these contamination groups.
#   python -m qloop eval -c configs/eval/suite.yaml --ckpt runs/s4_rl
_base_: [../base.yaml, ../model/qwen36_bf16.yaml]
run: {name: eval}
lsa:
  enabled: true
  mode: sparse                 # evaluate the sparse attention actually used at 1M
model:
  yarn_target_len: 1048576
eval:
  batch_size: 1
  defaults: {depths: [1, 2], n_samples: 1, limit: null}
  trained_contamination_groups: [kernelbench, arc_agi_2]   # we train on KB L1-2 and ARC train split
  benchmarks:
    - {name: aime_2026, n_samples: 16, temperature: 0.6, max_new_tokens: 32768}
    - {name: gpqa_diamond, max_new_tokens: 16384}
    - {name: hle, max_new_tokens: 16384}
    - {name: arc_agi_2, n_samples: 2, max_new_tokens: 16384}   # pass@2, the key loop-depth benchmark
    - {name: livecodebench, max_new_tokens: 16384}
    - {name: kernelbench_l3, max_new_tokens: 16384}
    - {name: longbench_v2, max_new_tokens: 1024}
  external:
    harbor: {dataset: "terminal-bench@2.0", agent: terminus-2, model: openai/qloop, env: daytona,
             api_base: "http://127.0.0.1:8000/v1", n_concurrent: 4}
    tau: {env: retail, model: qloop, api_base: "http://127.0.0.1:8000/v1"}
