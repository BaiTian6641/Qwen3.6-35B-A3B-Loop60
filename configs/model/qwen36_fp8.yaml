# Official Qwen [128, 128] block-scaled FP8 e4m3 weights (~35 GiB VRAM on RTX PRO 6000 Blackwell sm_120):
# optional FP8 base checkpoint preset (`configs/model/qwen36_nvfp4.yaml` is the primary default). Loads natively in
# transformers>=5 or via direct safetensors; qloop's transient `quant_autograd` bridge provides exact dL/dx input gradients
# (+ HotExpertDeltas auto-dequantization & Whole Model Pack export) with zero persistent BF16 copy.
model:
  name: Qwen/Qwen3.6-35B-A3B-FP8
  dtype: bfloat16
  attn_implementation: sdpa     # RTX PRO 6000 = sm_120: FlashAttention-3 is Hopper-only
  device_map: cuda:0
  text_only: true
  trust_remote_code: false
  yarn_target_len: null
  expected:
    num_hidden_layers: 40
    hidden_size: 2048
    num_attention_heads: 16
    num_key_value_heads: 2
    head_dim: 256
    full_attention_interval: 4
    num_experts: 256
    num_experts_per_tok: 8
    linear_num_key_heads: 16
    linear_num_value_heads: 32
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
