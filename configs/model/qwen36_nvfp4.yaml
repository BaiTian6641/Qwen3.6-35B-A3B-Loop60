# Unsloth Blackwell-calibrated NVFP4 Standard (~22.3 GiB text-only disk / ~24.1 GiB loaded VRAM on RTX PRO 6000 Blackwell sm_120):
# Primary default base checkpoint across all probing, evaluation, and training stages (`S0`, `S1`, `S1b`, `S3`, `S2`, `S4`).
# Keeps Layers 0-31 MoE experts in group-16 NVFP4 and Layers 32-39 coda experts + attention/lm_head in channel-wise FP8
# for full BF16/FP8 benchmark parity; loaded directly from safetensors with zero 60 GiB BF16 spike via qloop's direct
# loader + transient `quant_autograd` dL/dx bridge (HotExpertDeltas & Whole Model Pack export supported).
model:
  name: unsloth/Qwen3.6-35B-A3B-NVFP4
  dtype: bfloat16
  attn_implementation: sdpa     # RTX PRO 6000 = sm_120: FlashAttention-3 is Hopper-only
  device_map: cuda:0
  text_only: true
  trust_remote_code: false
  yarn_target_len: null
  expected:
    num_hidden_layers: 40
    hidden_size: 2048
    num_attention_heads: 16
    num_key_value_heads: 2
    head_dim: 256
    full_attention_interval: 4
    num_experts: 256
    num_experts_per_tok: 8
    linear_num_key_heads: 16
    linear_num_value_heads: 32
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
