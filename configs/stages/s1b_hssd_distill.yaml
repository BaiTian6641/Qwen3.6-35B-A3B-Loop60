# Gate 1 (S1b v3.2) - HSSD v3.2 Horizon-Split Surprise-Gated Delta Memory KL Distillation (4K -> 32K).
# Architecture: [0,12) x1 + [12,36) xR + [36,40) x1 = 88L (`s0_probe` calibrated ETD core `[12,36)` + `w_anchor=0.85`).
# Upgrades all 30 linear-attention layers from stock Qwen3.6 GDN (`s1_loop_a6b`) directly to HSSD v3.2:
#   * Strictly disjoint horizon partition `k_far = max(0, n - 8)` -> `[513, 576]` exact local SWA + `swa_recency_init: 0.05` (Fixes B1, H3)
#   * Full-strength `write_mode: full` Top-2 routed writes across `M=8` log-spaced pages + active-page compaction (Fixes H1/H6, 5.2 #4)
#   * Low-rank 2D phase (`theta_low_rank: true`, ~1.95M/layer) + post-rotation WY `chunk_hssd` & linear-beta `sqrt(w_t)` (Theorem 1)
#   * Multi-page routed chunk-start root-surprise (`surprise_mode: routed` against `boundary_ring[-1]`, zero `sqrt(s)` singularity)
#   * Compact lagged-replay `state_dtype: bfloat16` decode cache (`compact_decode_cache: true`, Fix H5) & `segment_chunks: 4` (256-tok WY ckpt)
#   * Zero-duplicate-VRAM `SharedBackboneTeacher` (`teacher_track: stock`) using `hssd.teacher_mode()` zero-hook fast path in Phase 2.
_base_: [../base.yaml, ../model/qwen36_nvfp4.yaml]
stage: s1b_hssd_distill
stage_type: lm
run: {name: s1b_hssd_distill}

loop:
  enabled: true
  prelude_end: 12
  core_end: 36
  num_passes: 3
  target_virtual_layers: 88
  kv_share: true
  bridge_init: [0.05, 0.85, 0.10]
  bridge_rank: 256
  bridge_mode: subspace
  bridge_up_std: 0.01
  attn_adapter_rank: 64
  step_embedding: true
  gate_init: 0.0
  per_pass_router: true
  router_adapter_rank: 32
  router_repel_init: 0.0
  router_diversity_weight: 0.0
  mor: false
  write_mask: true
  checkpoint: true
  train_pass_probs: [0.15, 0.50, 0.35]

gdn2:
  enabled: false                        # HSSD v3.2 is the primary linear-attention architecture (GDN-2 retired)

hssd:
  enabled: true
  write_mode: full                      # Fix H1/H6: full-strength 1.0 writes to each selected Top-k page via STE
  swa_recency_init: 0.05                # Fix H3: learnable per-head SWA recency slope inside local window
  blend_init: 0.0                       # Fix H2: step-0 forward == stock teacher in Phase 2, ramping -> 1.0
  blend_warmup_steps: 250
  compact_active_pages: true            # 5.2 #4: active-page/token compaction (~2.5-4x fewer WY/readout FLOPs)
  compact_decode_cache: true            # Fix H5: lagged-replay decode cache (~3-4x smaller per pass-layer)
  chunk_size: 64
  window_chunks: 8                      # Fix B1: k_far = max(0, n - 8), |I_loc| in [513, 576], 0 overlap
  num_pages: 8                          # Fix B2: M=8 log-spaced multi-timescale memory pages
  k_pages: 2                            # Fixes B2, B6: Top-2 sparse active write/read pages per chunk
  theta_low_rank: true                  # Pure linear theta_down + theta_up (~1.95M/layer, ~58.5M/30L vs 176.5M)
  surprise_mode: routed                 # Multi-page chunk-start surprise against Top-k write pages of boundary_ring[-1]
  state_dtype: bfloat16                 # Compact decode cache (fp32 WY updates + fp64 theta_cum)
  budget_weight: 1.0                    # Audit 3C: STE actual sparse Top-k write-mass budget regularizer
  segment_chunks: 4                     # 4 x 64 = 256-token checkpointed WY macro-segments (~4x lower backward peak VRAM)
  checkpoint_segments: true

distill:
  enabled: true
  share_backbone: true                  # 5.2 #7: zero-duplicate-VRAM SharedBackboneTeacher (0.00 GiB extra expert HBM)
  layerwise_warmup_steps: 400           # 5.2 #2: Phase-1 online per-layer teacher-forced warm-up before end-to-end KL
  teacher_ckpt: runs/s1_loop_a6b
  teacher_track: stock                  # stock linear-attention teacher (`hssd.teacher_mode()` zero-hook fast path in Phase 2)
  temperature: 1.0
  kl_weight: 1.0
  hidden_mse_weight: 0.1
  vocab_chunk_size: 4096                # avoids materializing [B, T, 248320] fp32 logits simultaneously

lsa:
  enabled: false

experts:
  enabled: false                        # 32.338B MoE experts stay 100% frozen (SHA-256 verified)

train:
  init_from: runs/s1_loop_a6b
  steps: 1500                           # 1500 x 4 x 16384 ≈ 98.3M tokens (micro_batch=1 x grad_accum=4 fits < 80 GiB across Phase 1 & 2 on G4)
  micro_batch: 1
  grad_accum: 4
  ckpt_every: 25
  sha256_frozen_experts: true
  train_loop_adapters: true
  train_hssd: true
  trainable:
    - "input_layernorm|post_attention_layernorm"
  allowed_groups: [loop_adapters, hssd_adapters, deltanet, norms]
  aux_weights: {loop_aux: 1.0, hssd_budget: 1.0, distill_kl: 1.0}
  optim:
    lr: 4.0e-5
    warmup_steps: 60
    lr_mult:
      hssd_adapter: 10.0
      loop_adapters: 5.0

data:
  seq_len: 16384                        # mid-horizon working memory curriculum (4K -> 32K)
  respect_doc_boundaries: false
  sources:
    - {name: finepdfs_mix, weight: 0.30}
    - {name: fineweb_edu, weight: 0.20}
    - {name: openthoughts3, weight: 0.20}
    - {name: nemotron_post, weight: 0.15}
    - {name: fable51, weight: 0.15}
  decontaminate: {enabled: true, ngram: 13, groups: [aime_2026, gpqa, hle, arc_agi_2, kernelbench], on_missing: warn}

eval_quick:
  n_batches: 8
  depths: [1, 2, 3]
