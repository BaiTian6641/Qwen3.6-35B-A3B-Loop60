# Gate 2a (S3 v3.2) - 1M GPU-Resident FP8 SharedKV + Per-Pass D-LSA + Long-Prefix / Short-Suffix Calibration.
# Architecture: [0,12) x1 + [12,36) xR + [36,40) x1 = 88L (`s0_probe` calibrated ETD core `[12,36)` + HSSD v3.2 + D-LSA).
# Resolves Fix C1 & Decision 1/2:
#   * 1M primary context (`1,048,576` tokens = `10.00 GiB` GPU FP8 KV + `320 MiB` GPU Ward centroids at 1.0x SharedKV)
#   * Untied per-pass query indexers `W_q_idx^(r)` (`num_query_passes: 3`) with shared `W_k_idx` & Ward buckets
#   * Pure YaRN 4.0x (`model.yarn_target_len: 1048576`, `rerope.enabled: false`; Gate 0p-3 winner: NLL=2.6459, +13.7209 passkey margin, 100% needle acc)
#   * `prefix_suffix_calibration_step`: streams 512K-992K prefix tokens under `torch.no_grad()` to populate true 1M-scale
#     FP8 KV + centroids, then backpropagates gradients on the final 32K query/answer suffix (`< 64 GiB` HBM on G4!).
#   * Includes optional Tier-2 10M Host-DDR5 Block-64 Walsh-Hadamard INT4 offload config (`offload.enabled: false`).
_base_: [../base.yaml, ../model/qwen36_nvfp4.yaml]
stage: s3_long_1m_lsa
stage_type: lm
run: {name: s3_long_1m_lsa}

model:
  yarn_target_len: 1048576

loop:
  enabled: true
  prelude_end: 12
  core_end: 36
  num_passes: 3
  target_virtual_layers: 88
  kv_share: true                        # 1.0x KV memory across all passes R in {1, 2, 3}
  bridge_init: [0.05, 0.85, 0.10]
  bridge_rank: 256
  bridge_mode: subspace
  bridge_up_std: 0.01
  attn_adapter_rank: 64
  step_embedding: true
  gate_init: 0.0
  per_pass_router: true
  router_adapter_rank: 32
  router_repel_init: 0.0
  router_diversity_weight: 0.0
  mor: false
  write_mask: true
  checkpoint: true
  train_pass_probs: [0.15, 0.50, 0.35]

gdn2:
  enabled: false

hssd:
  enabled: true
  write_mode: full
  swa_recency_init: 0.05
  horizon_tokens: 1048576               # Fix H7: scale vault-page mu_max inversely at 1M horizon
  compact_active_pages: true
  compact_decode_cache: true
  chunk_size: 64
  window_chunks: 8
  num_pages: 8
  k_pages: 2
  theta_low_rank: true
  surprise_mode: routed
  state_dtype: bfloat16
  budget_weight: 1.0
  segment_chunks: 4
  checkpoint_segments: true

lsa:
  enabled: true
  mode: hybrid                          # Fix D1: alternates sparse-forward + sampled KL so downstream Q/O & loop adapt to sparse attn
  compact_active_slots: true            # Fix D5: 2x smaller BucketIndex & slot_scores by dropping empty Ward slots
  max_selected_keys: 768                # Fix D6: tight valid-member packing in _sparse_chunk
  recall_threshold: 0.70                # Fix D1: recall gate before hybrid sparse-forward transitions
  hybrid_sparse_every: 2
  num_query_passes: 3                   # untied W_q_idx^(r) for Passes 1..3; shared W_k_idx & Ward centroids
  index_dim: 64
  index_on: nope                        # indexes strictly the 192 position-free NoPE dims [64:256]
  pool: 4
  block_size: 512
  avg_bucket_keys: 8
  max_bucket_keys: 32
  num_select: 64
  window: 512
  sinks: 64
  search: flat
  temperature: 0.1
  distill_weight: 1.0
  distill_query_frac: 0.0625
  query_chunk: 256

rerope:
  enabled: false                        # Gate 0p-3 calibrated `yarn` 4.0x winner over `rerope` (avoids double-warping rotary angles)
  linear_ceil: 131072
  log_scale: 32768
  max_pos: 240000
  rotary_dim: 64

long_calib:
  enabled: true                         # Fixes C1, D2, D3: sub-quadratic sparse-prefix + chunked-CE 32K suffix calibration
  prefix_len: 524288                    # 512K-992K streamed prefix under `torch.no_grad()` (`use_cache=True`)
  max_prefix_len: 1015808               # 992K prefix + 32K suffix = 1,048,576 (1M) tokens
  suffix_len: 32768                     # 32K differentiable suffix training QK-Norm, attn gates, Q/O LoRA & D-LSA
  chunk_size: 4096
  fp8_kv_cache: true                    # Tier-1 10.00 GiB GPU FP8 E4M3 KV cache
  prefix_lsa_mode: sparse               # Fix D3: sub-quadratic sparse D-LSA prefix streaming once warmed up (~15-30x faster)
  calib_every_steps: 10                 # 60 true 512K-1M calibration steps + 540 64K hybrid steps in 600 total steps
  sparse_prefix_after_step: 80

offload:
  enabled: false                        # Gate 2b Stretch: toggle `-s offload.enabled=true` for 10M Host-DDR5 INT4
  block_size: 64                        # Fix C2: Block-Diagonal H_64 keeps [0:64] mRoPE orthogonal to [64:256] NoPE
  micro_page_tokens: 4                  # Theorem 3: exact 2,304 B 4-token Group-64 INT4 micro-page (53.64 GiB @ 10M)
  prefetch_layers_ahead: 3              # async PCIe 5.0 prefetch hidden behind 3 preceding HSSD+MoE layers
  pin_memory: true

experts:
  enabled: false

train:
  init_from: runs/s1b_hssd_distill      # healed HSSD v3.2 + 88L loop checkpoint from Gate 1
  steps: 600                            # 540 x 64K hybrid steps + 60 x (512K-1M) calibration steps (~8-12h single Blackwell session)
  micro_batch: 1
  grad_accum: 2
  sha256_frozen_experts: true
  train_hssd: false                     # carry forward healed HSSD v3.2 weights; train read-side & D-LSA only
  train_gdn2: false
  train_loop_adapters: true
  train_lsa: true
  trainable:
    - "self_attn\\.(q_norm|k_norm)"
  allowed_groups: [loop_adapters, lsa_indexers, attention, norms]
  aux_weights: {loop_aux: 1.0, lsa_kl: 1.0}
  optim:
    lr: 1.0e-4
    warmup_steps: 40
    lr_mult:
      lsa_indexer: 10.0
      loop_adapters: 5.0

data:
  seq_len: 65536
  respect_doc_boundaries: false
  sources:
    - {name: finepdfs_mix, weight: 0.45}
    - {name: fineweb_edu, weight: 0.25}
    - {name: openthoughts3, weight: 0.15}
    - {name: fable51, weight: 0.15}
  decontaminate: {enabled: false}

eval_quick:
  n_batches: 4
  depths: [1, 2, 3]
