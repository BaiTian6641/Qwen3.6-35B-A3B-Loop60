# Option A (`s4_opt_a_d1_rl`) - 40L (`d=1`) GRPO-lambda + SI-RSI Verifiable RL on 96 GB GDDR7 ECC VRAM.
# Architecture: 40L native depth (`loop.enabled: false`) + pruned `GDN-2-1M` (`qed_enabled: false`, `neg_eigval_max_boost: 0.0`)
# + `D-LSA 1.0x` (`num_query_passes: 1`, `mode: sparse`) + 1M YaRN.
# Initializes from `runs/s3_opt_a_block_attn_calib` with 100% frozen MoE experts (`sha256_frozen_experts: true`).
# Uses DAPO clip-higher (`0.2 / 0.28`), accuracy-gated `GRPO-lambda` overlong + concise_bonus shaping (0% pass groups incur 0.0
# length penalty; concise_bonus rewards shorter verified-correct answers only when `pass_rate >= 0.25`), and surgical SI-RSI
# routing (`slap_target_groups: [router, shared_expert]`, `anti_slop_weight: 0.05`). 100% permissive clean-room sources only.
_base_: [../base.yaml, ../model/qwen36_nvfp4.yaml]
stage: s4_opt_a_d1_rl
stage_type: rl
run: {name: s4_opt_a_d1_rl}

model:
  yarn_target_len: 1048576

loop:
  enabled: false

gdn2:
  enabled: true
  rank: 64
  chunk_size: 64
  decay_log_min: -3.0
  decay_log_max: 0.5
  qed_enabled: false
  neg_eigval_max_boost: 0.0
  backend: auto

hssd:
  enabled: false

lsa:
  enabled: true
  mode: sparse
  compact_active_slots: true
  max_selected_keys: 768
  num_query_passes: 1
  index_dim: 64
  index_on: nope
  pool: 4
  block_size: 512
  avg_bucket_keys: 8
  max_bucket_keys: 32
  num_select: 64
  window: 512
  sinks: 64
  search: flat
  temperature: 0.1
  query_chunk: 256

experts:
  enabled: false

train:
  init_from: runs/s3_opt_a_block_attn_calib
  drop_inactive_loop_adapters: true
  steps: 300
  ckpt_every: 25
  sha256_frozen_experts: true
  train_loop_adapters: false
  train_hssd: false
  train_gdn2: true
  train_lsa: true
  trainable:
    - "mlp\\.gate\\.weight$"
    - "shared_expert\\."
    - "self_attn\\.(o_proj|q_norm|k_norm)"
    - "input_layernorm|post_attention_layernorm"
  allowed_groups: [gdn2_adapters, lsa_indexers, router, shared_expert, attention, norms]
  aux_weights:
    _replace_: true
  optim:
    lr: 1.0e-6
    warmup_steps: 10
    fused: false
    max_grad_norm: 0.5
    max_grad_norm_per_param: 0.5
    lr_mult:
      _replace_: true
      gdn2_adapter: 2.0
      lsa_indexer: 2.0
      "mlp\\.gate\\.weight$": 0.5

rl:
  tasks:
    - {source: hf, name: dapo_math, hf_id: BytedTsinghua-SIA/DAPO-Math-17k, split: train,
       prompt_field: prompt, answer_field: solution, verifier: "scorer:math", weight: 0.6}
    - {source: registry, name: kernelbench_train, verifier: "scorer:kernelbench", speedup_bonus: 0.5,
       device: cuda, weight: 0.4}
  group_size: 8
  prompts_per_step: 8
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 1.0
  micro_batch_seqs: 2
  clip_low: 0.2
  clip_high: 0.28
  adv_norm: std
  ppo_epochs: 1
  kl_coef: 0.0
  entropy_floor_frac: 0.6
  temperature_max: 1.3
  overlong:
    enabled: true
    buffer: 512
    penalty: 1.0
    accuracy_gated: true
    concise_bonus: 0.15
    target_tokens: 1536
    min_pass_rate: 0.25
  verifier_workers: 8
  teacher: {}
  sirsi:
    enabled: true
    slap_weight: 0.1
    slap_eps: 1.0e-4
    slap_max_seqs_per_step: 4
    slap_target_groups: [router, shared_expert]
    anti_slop_weight: 0.05
    min_answer_chars: 8
    guided_hint_enabled: true
    max_hints_per_step: 2
    failure_ledger: true
    curriculum_sculpt_n_tasks: 4
    regret_enabled: true
    atomic_checks_enabled: true
  gate:
    mode: soft_hurt
    eval_at_step_0: true
    lambda_hurt: 2.0
    max_hurt_frac: 0.05
    max_bench_drop: 0.025
    every: 50
    depth: 1
    min_delta: 0.0
    max_len_growth: 1.5
    rollback: true
    benchmarks:
      - {name: aime_2026, limit: 30, max_new_tokens: 2048}
      - {name: gpqa_diamond, limit: 50, max_new_tokens: 1024}

eval_quick:
  n_batches: 8
  depths: [1]
