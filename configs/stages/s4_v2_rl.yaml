# Gate 4 (S4 v2 GDN-2-1M + QED) - GRPO / SI-RSI with Verifiable Rewards on GDN-2-1M + QED + 88L Loop + 1M YaRN + Sparse D-LSA.
# Architecture: [0,12) x1 + [12,36) xR + [36,40) x1 = 88L (GDN-2-1M + Bounded QED + Soft Neg-Eigval + 88L Loop + D-LSA + 1M YaRN).
# Rollouts use the in-process cache sampler at the sampled loop depth (`R in {1, 2, 3}`, strictly on-policy).
_base_: [../base.yaml, ../model/qwen36_nvfp4.yaml]
stage: s4_v2_rl
stage_type: rl
run: {name: s4_v2_rl}

model:
  yarn_target_len: 1048576

loop:
  enabled: true
  prelude_end: 12
  core_end: 36
  num_passes: 3
  target_virtual_layers: 88
  kv_share: true
  bridge_init: [0.05, 0.85, 0.10]
  bridge_rank: 256
  bridge_mode: subspace
  bridge_up_std: 0.01
  attn_adapter_rank: 64
  step_embedding: true
  gate_init: 0.0
  per_pass_router: true
  router_adapter_rank: 32
  router_repel_init: 0.0
  router_diversity_weight: 0.0
  mor: false
  write_mask: true
  checkpoint: true
  train_pass_probs: [0.10, 0.35, 0.55]

gdn2:
  enabled: true
  rank: 64
  chunk_size: 64
  decay_log_min: -3.0
  decay_log_max: 0.5
  qed_enabled: true
  qed_max_lambda: 0.35
  neg_eigval_max_boost: 0.5
  backend: auto

hssd:
  enabled: false                        # GDN-2-1M + Bounded QED + Soft Neg-Eigval (no HSSD)

lsa:
  enabled: true
  mode: sparse
  compact_active_slots: true
  max_selected_keys: 768
  num_query_passes: 3
  index_dim: 64
  index_on: nope
  pool: 4
  block_size: 512
  avg_bucket_keys: 8
  max_bucket_keys: 32
  num_select: 64
  window: 512
  sinks: 64
  search: flat
  temperature: 0.1
  query_chunk: 256

experts:
  enabled: false                        # optional: pass `-s experts.enabled=true` after `qloop scan-experts`
  stats_path: runs/s1_loop_a6b/esft_stats_looped.json
  fraction: 0.025
  by: affinity
  per_pass: union
  rank: 64

train:
  init_from: runs/s2_v2_joint_bptt
  steps: 400
  ckpt_every: 25
  sha256_frozen_experts: true
  train_loop_adapters: true
  train_hssd: false
  train_gdn2: true
  train_lsa: true
  trainable:
    - "mlp\\.gate\\.weight$"
    - "shared_expert\\."
    - "self_attn\\.(o_proj|q_norm|k_norm)"
    - "input_layernorm|post_attention_layernorm"
  allowed_groups: [loop_adapters, gdn2_adapters, lsa_indexers, router, shared_expert, attention, norms, expert_deltas]
  aux_weights:
    _replace_: true
    loop_aux: 1.0
  optim:
    lr: 1.0e-6
    warmup_steps: 10
    fused: false                        # atomic whole-step guard + global clip + AdamW
    max_grad_norm: 0.5
    max_grad_norm_per_param: 0.5
    lr_mult:
      _replace_: true
      loop_adapters: 5.0
      gdn2_adapter: 2.0
      lsa_indexer: 2.0
      "mlp\\.gate\\.weight$": 0.5

rl:
  tasks:
    - {source: hf, name: dapo_math, hf_id: BytedTsinghua-SIA/DAPO-Math-17k, split: train,
       prompt_field: prompt, answer_field: solution, verifier: "scorer:math", weight: 0.6}
    - {source: registry, name: kernelbench_train, verifier: "scorer:kernelbench", speedup_bonus: 0.5,
       device: cuda, weight: 0.4}
  group_size: 8
  prompts_per_step: 8
  max_new_tokens: 8192
  temperature: 1.0
  top_p: 1.0
  micro_batch_seqs: 2
  clip_low: 0.2
  clip_high: 0.28
  adv_norm: std
  ppo_epochs: 1
  kl_coef: 0.0
  entropy_floor_frac: 0.6
  temperature_max: 1.3
  overlong: {enabled: true, buffer: 1024, penalty: 1.0}
  verifier_workers: 8
  teacher: {}                  # {base_url: https://api.example.com/v1, model: <frontier>, api_key_env: TEACHER_API_KEY,
                               #  max_calls_per_step: 2, sft_weight: 0.1}
  sirsi:
    enabled: true
    slap_weight: 0.1
    slap_eps: 1.0e-4
    slap_max_seqs_per_step: 4
    slap_target_groups: [loop_adapters, router]   # surgical slap routing (zero slap grad on attention/GDN/norms/base)
    anti_slop_weight: 0.05                        # bounded final-answer-only tie-breaker (never overrides correctness)
    min_answer_chars: 8
    guided_hint_enabled: true                     # auto-escalates when rl.teacher.base_url is set; safe without TEACHER_API_KEY
    max_hints_per_step: 2
    failure_ledger: true
    curriculum_sculpt_n_tasks: 4
  gate:
    every: 50
    depth: 3
    min_delta: 0.0
    max_len_growth: 1.5
    rollback: true
    benchmarks:
      - {name: aime_2026, limit: 30, max_new_tokens: 16384}
      - {name: kernelbench_l3, limit: 20}

eval_quick:
  n_batches: 8
  depths: [1, 2, 3]
