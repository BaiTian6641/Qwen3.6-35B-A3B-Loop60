[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qloop"
version = "0.1.0"
description = "Looped-depth (ETD/MoR/mHC) retrofit + ESFT/APOLLO/CCE training stack for Qwen3.6-35B-A3B on a single Colab RTX PRO 6000 Blackwell"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.6",
  "pyyaml>=6",
  "numpy",
]

[project.optional-dependencies]
# Heavy GPU stack: installed by scripts/colab_setup.sh (versions are logged + frozen by `qloop doctor --freeze`)
colab = [
  "transformers>=5.0",
  "accelerate",
  "datasets>=3.0",
  "huggingface_hub>=0.30",
  "safetensors",
  "sentencepiece",
  "apollo-torch",
  "cut-cross-entropy",
  "flash-linear-attention",
]
dev = ["pytest"]

[project.scripts]
qloop = "qloop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# local dev = macOS system python 3.9; Colab = 3.12. Keep 3.9-compatible syntax.
target-version = "py39"
line-length = 120
extend-exclude = [".venv", "runs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004",  # complexity: research code; HF-dictated signatures
  "PLC0415",  # lazy imports are intentional (heavy GPU deps are optional on the dev laptop)
  "RUF001", "RUF002", "RUF003",  # CJK / unicode in docs and log strings is intentional
  "B905",     # zip(strict=) is py310+
  "PLW0603",  # module-level debug state uses `global`
  "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["qloop"]
